server:
  port: 8080

spring:
  datasource:
    username: root
    password: lovealmighty
    url: jdbc:mysql://localhost:3306/search_engine?serverTimezone=UTC
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

indexing-settings:
  sites:
    - url: https://dombulgakova.ru/
      name: DOM BULGAKOVA
    - url: https://nikoartgallery.com/
      name: art!

batch:
  page-size: 5
  page-flush-interval-ms: 2000
  lemma-size: 500
  lemma-flush-interval-ms: 1000

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: ERROR
    org.hibernate.SQL: OFF
    org.hibernate.type: OFF
    com.zaxxer.hikari: WARN
    searchengine: DEBUG